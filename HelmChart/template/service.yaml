apiVersion: v1
kind: Service
metadata:
  name: service-loadbalance

spec:
  type: {{.Values.service.type}}
  selector:
    project: JCS-Global-service
    user: maruthi
    role: project-lead
    purpose: load-balance  
  ports:
    - protocol: TCP
      port: {{.Values.service.port}}
      targetPort: {{.Values.service.targetPort}}
      nodePort: 30080  