apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    project: jpay-JCS
    user: maruthi
    role: project-lead
spec:
  replicas: 3
  selector:
    matchLabels:
      project: jpay-JCS
      user: maruthi
      role: project-lead
  template:
    metadata:
      labels:
        project: jpay-JCS
        user: maruthi
        role: project-lead
    spec:
      containers:
        - name: nginx-container
          image: nginx
          ports:
            - containerPort: 80


---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  labels:
    project: jpay-JCS
    user: maruthi
    role: project-lead
spec:
  selector:
    project: jpay-JCS
    user: maruthi
    role: project-lead
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
  type: ClusterIP