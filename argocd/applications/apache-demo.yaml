
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apache-demo
  namespace: argocd

spec:
  project: default
  source:
    repoURL: https://github.com/Maruthi22k/DevOpsValues.git
    targetRevision: main
    path: argocd/apache

  destination:
    server: https://kubernetes.default.svc
    namespace: apache-demo    ## This is the namespace where the application will be deployed. and match the namespace (apache-demo in deployment.yaml) in the project destinations.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true