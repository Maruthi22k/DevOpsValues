
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-helm-demo
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://charts.bitnami.com/bitnami
    targetRevision: "15.14.0"
    helm:
      releaseName: nginx-helm-demo
      # valueFiles:
      #   - values.yaml
      
  destination:
    server: https://kubernetes.default.svc
    namespace: nginx-helm-demo

  syncPolicy:
    syncOptions:
      - CreateNamespace=true