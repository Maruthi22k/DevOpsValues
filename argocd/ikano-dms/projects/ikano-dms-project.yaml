apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: ikano-dms
  namespace: argocd
spec:
  description: IKANO DMS GitOps workloads

  sourceRepos:
    - https://github.com/Maruthi22k/DevOpsValues.git

  destinations:
    - server: "*"
      namespace: ikano-dms

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: policy
      kind: PodDisruptionBudget


  ## kubectl apply -f argocd/ikano-dms/projects/ikano-dms-project.yaml

