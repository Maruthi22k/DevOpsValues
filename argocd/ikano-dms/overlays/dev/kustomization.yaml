apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ikano-dms

resources:
  - ../../base

replicas:
  - name: ikano-dms
    count: 2

images:
  - name: REPLACE_WITH_ECR_IMAGE
    newName: 495209412092.dkr.ecr.us-east-1.amazonaws.com/ikano-dms
    digest: sha256:REPLACE_WITH_REAL_DEV_DIGEST

patches:
  - target:
      kind: ConfigMap
      name: ikano-dms-config
    patch: |-
      - op: replace
        path: /data/APP_ENV
        value: dev
      - op: replace
        path: /data/LOG_LEVEL
        value: debug


