
# Deploy Apache using Argo CD + GitHub Actions

apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache-demo
  labels:
    app: apache-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apache-demo
  template:
    metadata:
      labels:
        app: apache-demo
    spec:
      containers:
        - name: apache
          image: httpd:2.4-alpine
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: website-content
              mountPath: /usr/local/apache2/htdocs/index.html
              subPath: index.html
              readOnly: true
      volumes:
        - name: website-content
          configMap:
            name: apache-demo-content
