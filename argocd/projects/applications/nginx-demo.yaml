
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nginx-demo
  namespace: argocd

spec:
  project: nginx-team

  source:
    repoURL: https://github.com/Maruthi22k/DevOpsValues.git
    targetRevision: main
    path: argocd/nginx


  destination:
    server: https://kubernetes.nginx-team.svc
    namespace: nginx-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
