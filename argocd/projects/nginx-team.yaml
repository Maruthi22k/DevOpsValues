apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: nginx-team
  namespace: argocd
  
spec:
  description: Project for the Nginx application team
  sourceRepos:
    - https://github.com/Maruthi22k/DevOpsValues.git

  destinations:
    - namespace: nginx-demo
      server: https://kubernetes.default.svc

  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment


