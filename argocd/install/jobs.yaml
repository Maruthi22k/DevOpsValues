apiVersion: batch/v1
kind: Job
metadata:
  name: example-pre-deploy
  namespace: nginx-demo
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: check
          image: busybox:1.36
          command: ["sh", "-c", "echo Pre-deployment check passed"]


