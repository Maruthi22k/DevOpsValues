
name: Validate Apache Manifests

on:
  pull_request:
    paths:
      - "argocd/apache/**"
      - ".github/workflows/validate-app-manifests.yml"
  push:
    branches:
      - main
    paths:
      - "argocd/apache/**"
      - ".github/workflows/validate-app-manifests.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          VERSION="0.6.7"
          curl -fsSL \
            "https://github.com/yannh/kubeconform/releases/download/v${VERSION}/kubeconform-linux-amd64.tar.gz" \
            -o /tmp/kubeconform.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
          kubeconform -v

      - name: Validate Apache Kubernetes manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            argocd/apache/configmap.yaml \
            argocd/apache/deployment.yaml \
            argocd/apache/service.yaml
