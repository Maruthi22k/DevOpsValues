apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dev-cluster
rules:
- apiGroups: [""]
  resources:
    - pods
    - services
  verbs: ["get", "list", "watch"]

- apiGroups: ["apps"]
  resources: ["deployments","replicasets"] 
  verbs: ["get", "list", "watch"]



    # kubectl apply -f clusterrole.yaml
    # kubectl get clusterrole dev-cluster
    # kubectl describe clusterrole dev-cluster