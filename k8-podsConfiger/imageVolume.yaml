apiVersion: v1
kind: Pod
metadata:
  name: image-volume

spec:
  containers:
  - name: shell
    command: ["sleep", "infinity"]
    image: debian

    volumeMounts:
    - name: volume
      mountPath: /volume
      
  volumes:
  - name: volume
    image:
      reference: quay.io/crio/artifact:v2
      pullPolicy: IfNotPresent



## kubectl apply -f https://k8s.io/examples/pods/image-volumes.yaml
## kubectl exec image-volume -it -- bash
