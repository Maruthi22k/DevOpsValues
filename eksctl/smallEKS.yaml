apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: roboshop-dev
  region: us-east-1

managedNodeGroups:
  - name: roboshop-dev-ng
    instanceTypes:
      - t3.small
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    spot: true




